[workspace]
resolver = "3"
members = [
    "crates/qgate-core",
    "crates/qgate-lang",
    "crates/qgate-analyzers",
    "crates/qgate-report",
    "crates/qgate-git",
    "crates/qgate-config",
    "crates/qgate-cli",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nagypalervin/qgate"
authors = ["Ervin Nagypál"]

[workspace.dependencies]
qgate-core = { path = "crates/qgate-core", version = "0.3.1" }
qgate-lang = { path = "crates/qgate-lang", version = "0.3.1" }
qgate-analyzers = { path = "crates/qgate-analyzers", version = "0.3.1" }
qgate-report = { path = "crates/qgate-report", version = "0.3.1" }
qgate-git = { path = "crates/qgate-git", version = "0.3.1" }
qgate-config = { path = "crates/qgate-config", version = "0.3.1" }

# External
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-c-sharp = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = { version = "0.4", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# Release binaries carry no debug symbols (design D5 of
# `add-release-binaries`).
[profile.release]
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
