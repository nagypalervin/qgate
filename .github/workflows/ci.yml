name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Smoke test
        run: cargo run -q -p qgate-cli -- --version

      - name: Smoke test qgate check
        # Explicit bash enables pipefail, so a qgate failure is not hidden by grep.
        # The example has an Error finding; --fail-on never keeps the exit code 0.
        shell: bash
        run: |
          cargo run -q -p qgate-cli -- check --fail-on never \
            crates/qgate-cli/tests/fixtures/old/orders.ts \
            crates/qgate-cli/tests/fixtures/src/orders.ts \
            | grep -F '[complexity/cyclomatic-increase]'
