name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Smoke test
        run: cargo run -q -p qgate-cli -- --version

      - name: Smoke test qgate check
        # Explicit bash enables pipefail, so a qgate failure is not hidden by grep.
        # The example has an Error finding; --fail-on never keeps the exit code 0.
        shell: bash
        run: |
          cargo run -q -p qgate-cli -- check --fail-on never \
            crates/qgate-cli/tests/fixtures/old/orders.ts \
            crates/qgate-cli/tests/fixtures/src/orders.ts \
            | grep -F '[complexity/cyclomatic-increase]'

  msrv:
    # Keep in sync with `rust-version` in Cargo.toml. With `--locked`, a
    # locked dependency that needs a newer Rust fails here instead of for
    # users on the minimum version.
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85

      - uses: Swatinem/rust-cache@v2

      - name: Test on the minimum supported Rust version
        run: cargo test --workspace --locked

  platforms:
    # The other platforms qgate ships binaries for (the `releases` spec);
    # Linux x64 is the `check` job. Each runs its native host target.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked
